<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%" fill="none">
  <!-- Fondo Opcional Transparente / Contenedor Base -->
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FFBBE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDB8"/>
      <stop offset="100%" stop-color="#FFB95F"/>
    </linearGradient>
    <linearGradient id="drawerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2B3C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ISOTIPO: LA GAVETA DEL CUADRE PERFECTO -->
  <g transform="translate(20, 15)">
    <!-- Base Caja / Gaveta Táctica -->
    <rect x="0" y="0" width="110" height="110" rx="24" fill="url(#drawerGrad)" stroke="#3C4A42" stroke-width="2.5"/>
    
    <!-- Ranura Superior de la Gaveta (Slot) -->
    <rect x="25" y="18" width="60" height="6" rx="3" fill="#334155"/>
    
    <!-- Arco Ámbar Superior: La Moneda y el Balance -->
    <circle cx="55" cy="58" r="32" stroke="url(#amberGrad)" stroke-width="4" stroke-dasharray="140 60" stroke-linecap="round"/>
    
    <!-- El Check Táctico: El Cuadre Ciego Validado (Fosforescente) -->
    <path d="M40 58 L52 70 L74 44" stroke="url(#mintGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Punto de Balanza / Precisión -->
    <circle cx="55" cy="58" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- LOGOTIPO TIPOGRÁFICO -->
  <!-- "EL CUADRE" -->
  <text x="155" y="72" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
    EL CUADRE
  </text>

  <!-- Badge "POS" -->
  <g transform="translate(425, 40)">
    <rect x="0" y="0" width="68" height="34" rx="10" fill="url(#mintGrad)"/>
    <text x="34" y="23" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#003824" text-anchor="middle" letter-spacing="1">
      POS
    </text>
  </g>

  <!-- Subtítulo / Propuesta de Valor -->
  <text x="156" y="104" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5" fill="#94A3B8">
    TERMINAL DE VENTA OFFLINE &amp; BALANZA
  </text>
  
  <!-- Punto indicador de estado "En Línea / Cuadrado" -->
  <circle cx="510" cy="100" r="4" fill="#4EDEA3"/>
  <text x="522" y="104" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4EDEA3" letter-spacing="1">
    100% EDGE
  </text>
</svg>
