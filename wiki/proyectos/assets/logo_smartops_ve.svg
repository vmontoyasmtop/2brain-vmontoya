<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="soGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="soBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <filter id="soGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ISOTIPO SMARTOPS: Hexágono / Circuito Inteligente con rayo/S -->
  <g transform="translate(15, 15)">
    <!-- Base Hexagonal / Shield -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#soBg)" stroke="#2A3859" stroke-width="2.5"/>
    
    <!-- Órbita de Operaciones -->
    <circle cx="40" cy="40" r="26" stroke="#2A3859" stroke-width="2" stroke-dasharray="12 6"/>

    <!-- Símbolo "S" / Pulso Operativo Inteligente -->
    <path d="M 50 25 C 34 25 30 35 40 40 C 50 45 46 55 30 55" 
          stroke="url(#soGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soGlow)"/>

    <!-- Nodo Conector / Chip -->
    <circle cx="50" cy="25" r="3.5" fill="#FFFFFF"/>
    <circle cx="30" cy="55" r="3.5" fill="#00E5FF"/>
  </g>

  <!-- TIPOGRAFÍA SMARTOPS VE -->
  <text x="115" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
    SmartOps
  </text>
  
  <!-- BADGE "VE" -->
  <g transform="translate(285, 33)">
    <rect x="0" y="0" width="46" height="28" rx="8" fill="url(#soGrad)"/>
    <text x="23" y="19" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#0B132B" text-anchor="middle" letter-spacing="0.5">
      VE
    </text>
  </g>

  <!-- SUBTÍTULO CORPORATIVO -->
  <text x="117" y="84" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#7A8CA5" letter-spacing="2">
    SOFTWARE &amp; CLOUD RETAIL SOLUTIONS
  </text>
</svg>
