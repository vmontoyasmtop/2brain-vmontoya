<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%" fill="none">
  <!-- EL CUADRE FASHION EDITION — DARK MODE (OFICIAL) -->
  <defs>
    <linearGradient id="fashionCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="fashionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ISOTIPO FASHION "C" + CHECK TÉCNICO -->
  <g transform="translate(16, 15)">
    <!-- Marco "C" Geométrico Alta Gama con Bisel Hangtag -->
    <path d="M 72 12 L 32 12 C 18 12 8 22 8 36 L 8 54 C 8 68 18 78 32 78 L 72 78" 
          stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ojal / Remache Textil en Oro Champán -->
    <circle cx="26" cy="26" r="3.5" fill="url(#goldAccent)"/>
    <!-- Check Central de Precisión & Fit -->
    <path d="M 24 46 L 38 60 L 72 22" 
          stroke="url(#fashionCheckGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fashionGlow)"/>
  </g>

  <!-- TIPOGRAFÍA PRINCIPAL -->
  <text x="114" y="62" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="#F8FAFC">
    El Cuadre
  </text>
  
  <!-- BADGE "FASHION" -->
  <g transform="translate(328, 36)">
    <rect x="0" y="0" width="84" height="28" rx="7" fill="url(#goldAccent)"/>
    <text x="42" y="19" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#0B0F17" text-anchor="middle" letter-spacing="1">
      FASHION
    </text>
  </g>

  <!-- SUBTÍTULO DESCRIPTOR -->
  <text x="116" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2.2">
    ROPA, CALZADO &amp; RETAIL OS
  </text>
</svg>
