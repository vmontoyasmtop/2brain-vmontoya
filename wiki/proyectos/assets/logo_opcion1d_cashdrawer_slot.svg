<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <!-- VARIACIÓN 1D: LA GAVETA TÁCTICA MINIMALISTA (Ranura de Caja + Check) -->
  <g transform="translate(20, 18)">
    <!-- Squircle base -->
    <rect x="6" y="6" width="74" height="74" rx="20" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="4"/>
    <!-- Ranura minimalista superior de la gaveta -->
    <rect x="26" y="18" width="34" height="5" rx="2.5" fill="#FFB95F"/>
    <!-- Check limpio -->
    <path d="M25 46 L37 58 L59 34" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tipografía -->
  <text x="130" y="66" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
    elcuadre<tspan fill="#FFB95F">pos</tspan>
  </text>
  <text x="132" y="92" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
    TERMINAL DE GAVETA &amp; CONTROL TOTAL
  </text>
</svg>
