<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="isoMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FFBBE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="isoAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDB8"/>
      <stop offset="100%" stop-color="#FFB95F"/>
    </linearGradient>
    <linearGradient id="isoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2B3C"/>
      <stop offset="100%" stop-color="#051424"/>
    </linearGradient>
    <filter id="isoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Contenedor Cuadrado con Bordes Redondeados (App Icon / Profile) -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#isoBg)" stroke="#3C4A42" stroke-width="4"/>
  
  <!-- Ranura Táctica de Caja Registradora -->
  <rect x="55" y="38" width="90" height="8" rx="4" fill="#334155"/>

  <!-- Anillo Bimonetario Ámbar ($ y Bs en equilibrio) -->
  <circle cx="100" cy="110" r="54" stroke="url(#isoAmber)" stroke-width="6" stroke-dasharray="230 100" stroke-linecap="round"/>

  <!-- El Check del Cuadre Ciego (Esmeralda Fosforescente) -->
  <path d="M72 108 L94 130 L136 84" stroke="url(#isoMint)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#isoGlow)"/>

  <!-- Perno Central de Precisión / Balanza -->
  <circle cx="100" cy="110" r="5" fill="#FFFFFF"/>
</svg>
