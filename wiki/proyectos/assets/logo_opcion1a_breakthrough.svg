<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <!-- VARIACIÓN 1A: EL CHECK DINÁMICO (Rompe el marco en la esquina superior) -->
  <defs>
    <linearGradient id="v1aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EDEA3"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(20, 18)">
    <!-- Squircle abierto en la esquina superior derecha -->
    <path d="M 54 8 L 22 8 A 16 16 0 0 0 6 24 L 6 60 A 16 16 0 0 0 22 76 L 62 76 A 16 16 0 0 0 78 60 L 78 30" 
          stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Check enérgico que sale por la apertura de la gaveta -->
    <path d="M24 44 L38 58 L78 14" 
          stroke="url(#v1aGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tipografía -->
  <text x="130" y="66" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
    elcuadre<tspan fill="#10B981" font-weight="400">pos</tspan>
  </text>
  <text x="132" y="92" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1.5">
    TERMINAL OFFLINE &amp; BALANZA
  </text>
</svg>
