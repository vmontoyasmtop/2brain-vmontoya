  </text>
  <!-- Dot / Badge POS -->
  <text x="315" y="68" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="400" fill="#10B981">
    pos
  </text>

  <!-- Subtítulo limpio -->
  <text x="127" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1.5">
