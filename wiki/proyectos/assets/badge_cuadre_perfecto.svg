<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDB8"/>
      <stop offset="50%" stop-color="#EE9800"/>
      <stop offset="100%" stop-color="#FFB95F"/>
    </linearGradient>
    <linearGradient id="badgeMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FFBBE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Anillo Exterior Dentado / Sello de Garantía -->
  <circle cx="120" cy="120" r="105" fill="#0D1C2D" stroke="url(#badgeGold)" stroke-width="4" stroke-dasharray="12 4" filter="url(#badgeShadow)"/>
  
  <!-- Círculo Interior Sólido -->
  <circle cx="120" cy="120" r="88" fill="#051424" stroke="#273647" stroke-width="2"/>

  <!-- Textos Curvilíneos / Sellos -->
  <text x="120" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#FFB95F" text-anchor="middle" letter-spacing="3">
    ★ GARANTÍA TOTAL ★
  </text>
  
  <!-- Ícono Central: Check & Vault -->
  <path d="M96 116 L112 132 L150 94" stroke="url(#badgeMint)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="120" y="162" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    CUADRE PERFECTO
  </text>

  <text x="120" y="180" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#4EDEA3" text-anchor="middle" letter-spacing="1.5">
    30 DÍAS BLINDADOS
  </text>
</svg>
