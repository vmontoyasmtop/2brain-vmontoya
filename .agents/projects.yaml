# Registro de proyectos — router de packs
# Un proyecto = una ficha. El router usa `pack` y `repo_env` para decidir.
# `verified: false` significa que la ruta aún no se confirma en esta máquina;
# el router debe preguntar en vez de adivinar.
version: 1
updated: "2026-11-07"

defaults:
  docs: "wiki/proyectos/<id>/"
  branch: "feat/<id>-<slug>"
  coverage_min: 85

projects:
  - id: masterhub
    name: "MasterHub (MG-HUB)"
    pack: fellowship
    repo_env: MG_HUB_PATH
    repo_subpath: "."
    verified: false
    tracker: { system: plane, url: "https://projects.mastergroupve.com" }
    wiki: "wiki/proyectos/masterhub/"
    legacy:
      - "wiki/proyectos/api-gateway.md"
      - "wiki/proyectos/masterhub-hr-portal-gerente.md"
    status: activo

